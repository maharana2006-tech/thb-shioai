## Staging-only overrides. Activated by SPRING_PROFILES_ACTIVE=staging (set in
## docker-compose.staging.yml). Only values that differ from application.properties
## go here — the base file supplies everything else.

# Oracle NDS off in staging. Picked up by @ConditionalOnProperty on
# OracleDataSourceConfig; the whole module skips with no startup probe.
multiship.oracle.enabled=${MULTISHIP_ORACLE_ENABLED:false}

# Cookie policy for plain-HTTP staging. Lax works over HTTP same-origin;
# Secure OFF because TLS is not terminated by nginx yet.
cookie.samesite=${COOKIE_SAMESITE:Lax}
cookie.secure=${COOKIE_SECURE:false}

# Carrier API log — useful in staging for QA diagnostics (deep-dives can
# query the carrier_api_log table directly).
multiship.observability.carrier-api-log.enabled=${CARRIER_API_LOG_ENABLED:true}

# Spring Data Redis — compose points at redis:6379.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Fresh-DB bootstrap for staging. The codebase's doctrine (per
# docs/flyway-fresh-db-guard-pattern.md) is that Hibernate ddl-auto=update
# creates tables from entity metadata FIRST, then Flyway layers ALTERs
# on top via idempotent migrations. But Spring Boot wires Flyway as a
# dependency of entityManagerFactory — Flyway fires BEFORE Hibernate on
# a fresh box. Legacy migrations (V3-era) aren't fully to_regclass-
# guarded; they explode on "relation 'users' does not exist".
#
# Attempt #1 was spring.flyway.baseline-version=143. That doesn't help:
# Flyway's baseline-on-migrate only triggers on a NON-EMPTY schema with
# no history table. On a truly empty DB, baseline-version is ignored
# and Flyway runs V1..Vn in order — V3 still blows up.
#
# Attempt #2 (this one) — disable Flyway entirely for the staging profile.
# Hibernate's ddl-auto=update creates every table from @Entity metadata
# at startup, including the deltas every migration would have added
# (because the entity classes already encode the current schema shape).
# Staging boots clean; no migration-level data seed runs (operator seeds
# via admin UI or pg_dump --data-only from dev); same model prod ran
# under through Sprint 48.
#
# When CI's fresh-DB test lands a V144-and-forward policy where every
# new migration is to_regclass-guarded (docs/flyway-fresh-db-guard-pattern.md),
# flip this back on and set baseline-version to the Vn immediately
# before the first guarded migration.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Datasource env-vars already read by application.properties:
#   DB_URL / DB_USERNAME / DB_PASSWORD — resolved from compose service names.
