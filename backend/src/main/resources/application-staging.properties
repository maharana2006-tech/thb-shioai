## Staging-only overrides. Activated by SPRING_PROFILES_ACTIVE=staging (set in
## docker-compose.staging.yml). Only values that differ from application.properties
## go here — the base file supplies everything else.

# Oracle NDS off in staging. Picked up by @ConditionalOnProperty on
# OracleDataSourceConfig; the whole module skips with no startup probe.
multiship.oracle.enabled=${MULTISHIP_ORACLE_ENABLED:false}

# Cookie policy for plain-HTTP staging. Lax works over HTTP same-origin;
# Secure OFF because TLS is not terminated by nginx yet.
cookie.samesite=${COOKIE_SAMESITE:Lax}
cookie.secure=${COOKIE_SECURE:false}

# Carrier API log — useful in staging for QA diagnostics (deep-dives can
# query the carrier_api_log table directly).
multiship.observability.carrier-api-log.enabled=${CARRIER_API_LOG_ENABLED:true}

# Spring Data Redis — compose points at redis:6379.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Datasource env-vars already read by application.properties:
#   DB_URL / DB_USERNAME / DB_PASSWORD — resolved from compose service names.
