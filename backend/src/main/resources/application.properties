# ==========================================
# Database Configuration
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/multiship_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.classformat.ignore=true
# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.highlight_sql=true

# ==========================================
# Messages / Internationalization
# ==========================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600

# ==========================================
# Server Configuration
# ==========================================
server.port=8080
server.servlet.context-path=/
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# ==========================================
# Swagger / OpenAPI Configuration
# ==========================================
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ==========================================
# Jackson Configuration
# ==========================================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# ==========================================
# Logging Configuration
# ==========================================
logging.level.com.multiship.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.orm.jdbc.extract=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==========================================
# JWT Configuration
# ==========================================
jwt.secret=${JWT_SECRET:multishipSecretKeyForJWTTokenGeneration2026}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# Carrier Configuration
# ==========================================
carrier.default-carrier-code=FEDEX
carrier.default-environment=SANDBOX
carrier.connection-timeout-seconds=30
carrier.read-timeout-seconds=30

carrier.fed-ex.api-base-url=https://apis.fedex.com
carrier.fed-ex.sandbox-url=https://apis-sandbox.fedex.com
carrier.fed-ex.auth-url=https://apis.fedex.com/oauth/token
carrier.fed-ex.api-version=v1
carrier.fed-ex.shipment-path=/ship/v1/shipments
carrier.fed-ex.tracking-path=/track/v1/trackingnumbers
carrier.fed-ex.token-path=/oauth/token
carrier.fed-ex.logo-url=https://www.fedex.com/content/dam/fedex-com/logos/fedex-logo.svg
carrier.fed-ex.documentation-url=https://developer.fedex.com
carrier.fed-ex.connection-guide=Use OAuth 2.0 client credentials with your FedEx account number.
carrier.fed-ex.default-service-type=FEDEX_GROUND
carrier.fed-ex.default-package-type=YOUR_PACKAGING
carrier.fed-ex.label-response-option=URL_ONLY

carrier.ups.api-base-url=https://onlinetools.ups.com
carrier.ups.sandbox-url=https://wwwcie.ups.com
carrier.ups.auth-url=https://onlinetools.ups.com/security/v1/oauth/token
carrier.ups.sandbox-auth-url=https://wwwcie.ups.com/security/v1/oauth/token
carrier.ups.api-version=v1
carrier.ups.shipment-path=/api/shipments
carrier.ups.tracking-path=/api/track
carrier.ups.token-path=/security/v1/oauth/token
carrier.ups.logo-url=https://www.ups.com/assets/resources/images/UPS_logo.svg
carrier.ups.documentation-url=https://developer.ups.com
carrier.ups.connection-guide=Use UPS OAuth client credentials with your UPS account.
carrier.ups.default-service-type=GROUND
carrier.ups.default-package-type=YOUR_PACKAGING
carrier.ups.label-response-option=URL_ONLY

# NOTE: Stamps.com host/paths depend on which product tier the account is on
# (Shipping API v3, SWSIM legacy, ShipEngine bridge, ...). The values below
# are Stamps.com Shipping API v3 conventions and were 404-ing during dev
# testing against api.stamps.com — check developer.stamps.com for the exact
# host and override in application-local.properties for your tier. The
# connector logs the URL it hits on every token failure so config drift is
# visible in the log.
carrier.stamps.api-base-url=https://api.stamps.com
carrier.stamps.sandbox-url=https://api.stamps.com
carrier.stamps.auth-url=https://api.stamps.com/v3/oauth/token
carrier.stamps.api-version=v3
carrier.stamps.shipment-path=/v3/shipments
carrier.stamps.tracking-path=/v3/tracking
carrier.stamps.token-path=/v3/oauth/token
carrier.stamps.logo-url=https://www.stamps.com/assets/logo.svg
carrier.stamps.documentation-url=https://developers.stamps.com
carrier.stamps.connection-guide=Use Stamps.com OAuth client credentials for USPS integration.
carrier.stamps.default-service-type=USPS_FIRST_CLASS
carrier.stamps.default-package-type=YOUR_PACKAGING
carrier.stamps.label-response-option=URL_ONLY

carrier.shipper.name=Multiship Warehouse
carrier.shipper.phone=0000000000
carrier.shipper.address-line1=1 Warehouse Way
carrier.shipper.address-line2=
carrier.shipper.city=Bengaluru
carrier.shipper.state=KA
carrier.shipper.postal-code=560001
carrier.shipper.country-code=IN
