# so the CarrierConnector interface stays uniform. Sandbox and prod share
# hostnames; only the credentials differ.
carrier.dhl.api-base-url=https://express.api.dhl.com/mydhlapi
carrier.dhl.sandbox-url=https://express.api.dhl.com/mydhlapi/test
carrier.dhl.auth-url=https://express.api.dhl.com/mydhlapi
carrier.dhl.sandbox-auth-url=https://express.api.dhl.com/mydhlapi/test
carrier.dhl.api-version=v2
carrier.dhl.shipment-path=/shipments
carrier.dhl.tracking-path=/tracking
carrier.dhl.token-path=/
carrier.dhl.logo-url=https://www.dhl.com/content/dam/dhl/global/core/images/logos/dhl-logo.svg
carrier.dhl.documentation-url=https://developer.dhl.com/api-reference/dhl-express-mydhl-api
