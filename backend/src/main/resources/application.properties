# ==========================================
# Carrier Configuration
# ==========================================
carrier.default-carrier-code=FEDEX
carrier.default-environment=SANDBOX
carrier.connection-timeout-seconds=30
carrier.read-timeout-seconds=30

# Sprint 48 B2 - MPS auto-split. When true, shipments exceeding a carrier's
# cap (from carrier_shipping_limit) are split into multiple carrier calls.
# Flip to false to hard-fail over-cap requests at the carrier instead
# (safety kill-switch if the splitter misbehaves in production).
carrier.auto-split-enabled=true

# Sprint 48 B5 - packaging validator kill-switch. When true, every write
# path (createManualShipment, generateLabel, rate-shop) runs PackagingValidator
# against the resolved preset. Flip to false to disable the check globally
# (over-packaged shipments then go to the carrier without pre-flight).
packaging.validation-enabled=true

carrier.fed-ex.api-base-url=https://apis.fedex.com
carrier.fed-ex.sandbox-url=https://apis-sandbox.fedex.com
carrier.fed-ex.auth-url=https://apis.fedex.com/oauth/token
carrier.fed-ex.api-version=v1
carrier.fed-ex.shipment-path=/ship/v1/shipments
carrier.fed-ex.tracking-path=/track/v1/trackingnumbers
carrier.fed-ex.token-path=/oauth/token
carrier.fed-ex.logo-url=https://www.fedex.com/content/dam/fedex-com/logos/fedex-logo.svg
carrier.fed-ex.documentation-url=https://developer.fedex.com
carrier.fed-ex.connection-guide=Use OAuth 2.0 client credentials with your FedEx account number.
carrier.fed-ex.default-service-type=FEDEX_GROUND
carrier.fed-ex.default-package-type=YOUR_PACKAGING
carrier.fed-ex.label-response-option=URL_ONLY

carrier.ups.api-base-url=https://onlinetools.ups.com
carrier.ups.sandbox-url=https://wwwcie.ups.com
carrier.ups.auth-url=https://onlinetools.ups.com/security/v1/oauth/token
carrier.ups.sandbox-auth-url=https://wwwcie.ups.com/security/v1/oauth/token
carrier.ups.api-version=v1
carrier.ups.shipment-path=/api/shipments
carrier.ups.tracking-path=/api/track
carrier.ups.token-path=/security/v1/oauth/token
carrier.ups.logo-url=https://www.ups.com/assets/resources/images/UPS_logo.svg
carrier.ups.documentation-url=https://developer.ups.com
carrier.ups.connection-guide=Use UPS OAuth client credentials with your UPS account.
carrier.ups.default-service-type=GROUND
carrier.ups.default-package-type=YOUR_PACKAGING
carrier.ups.label-response-option=URL_ONLY

# Stamps.com SWSIM v135 (SOAP). The user-supplied "Client ID" from the
# Stamps.com developer portal maps to IntegrationID; the account number
# maps to Username; the "Client Secret" maps to Password. The connector
# calls AuthenticateUser to obtain an Authenticator token; verify treats
# a non-blank Authenticator as a successful credential check.
carrier.stamps.api-base-url=https://swsim.stamps.com/swsim/swsimv135.asmx
carrier.stamps.sandbox-url=https://swsim.testing.stamps.com/swsim/swsimv135.asmx
carrier.stamps.auth-url=https://swsim.stamps.com/swsim/swsimv135.asmx
carrier.stamps.sandbox-auth-url=https://swsim.testing.stamps.com/swsim/swsimv135.asmx
carrier.stamps.api-version=v135
carrier.stamps.shipment-path=/swsim/swsimv135.asmx
carrier.stamps.tracking-path=/swsim/swsimv135.asmx
carrier.stamps.token-path=/swsim/swsimv135.asmx
carrier.stamps.logo-url=https://www.stamps.com/assets/logo.svg
carrier.stamps.documentation-url=https://developers.stamps.com
carrier.stamps.connection-guide=Use Stamps.com OAuth client credentials for USPS integration.
carrier.stamps.default-service-type=USPS_FIRST_CLASS
carrier.stamps.default-package-type=YOUR_PACKAGING
carrier.stamps.label-response-option=URL_ONLY

# DHL Express MyDHL API v2. Uses HTTP Basic Auth (not OAuth token) —
# the connector encodes clientId:clientSecret and passes it as the token
# so the CarrierConnector interface stays uniform. Sandbox and prod share
# hostnames; only the credentials differ.
carrier.dhl.api-base-url=https://express.api.dhl.com/mydhlapi
carrier.dhl.sandbox-url=https://express.api.dhl.com/mydhlapi/test
carrier.dhl.auth-url=https://express.api.dhl.com/mydhlapi
carrier.dhl.sandbox-auth-url=https://express.api.dhl.com/mydhlapi/test
carrier.dhl.api-version=v2
carrier.dhl.shipment-path=/shipments
carrier.dhl.tracking-path=/tracking
carrier.dhl.token-path=/
carrier.dhl.logo-url=https://www.dhl.com/content/dam/dhl/global/core/images/logos/dhl-logo.svg
carrier.dhl.documentation-url=https://developer.dhl.com/api-reference/dhl-express-mydhl-api
carrier.dhl.connection-guide=Use your MyDHL API Key + API Secret (from developer.dhl.com) — Basic Auth on every call.
carrier.dhl.default-service-type=P
carrier.dhl.default-package-type=YOUR_PACKAGING
carrier.dhl.label-response-option=URL_ONLY

