# ==========================================
# Database Configuration
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/multiship_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.classformat.ignore=true

# ==========================================
# Sprint 49 Tier 2 Fix 6 (partial) — protect the DB connection pool
# from long-running @Transactional methods that hold a connection
# during a 5-15s carrier HTTP call. See CarrierServiceImpl.generateLabel
# / generateManualLabel + MultiWarehouseLabelServiceImpl.generate — those
# still need the phase-A / carrier-call / phase-C split (follow-up sprint;
# splitting changes the all-or-nothing atomicity invariant, requires a
# saga design + IN_FLIGHT status column).
#
# For now: HikariCP leak detection logs a stack when any connection is
# held longer than 30s, and the global tx timeout caps @Transactional
# methods so a stuck carrier call can't wedge a worker indefinitely.
# ==========================================
spring.datasource.hikari.leak-detection-threshold=30000
spring.transaction.default-timeout=60
# Sprint 50 Tier 1 finding #6 — explicit pool size. Default was 10; with
# the 60s tx timeout above wrapping a 5-15s carrier RTT, that caps
# throughput at ~40 shipments/min platform-wide before Tomcat threads
# start blocking on the pool. Bumping to 50 aligns with the load-test
# plan's Phase 1 target (100 shipments/min/tenant × N tenants). Tune
# per-env via DB_POOL_SIZE if the DB CPU / Postgres max_connections
# can't absorb it (default Postgres is 100).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:50}

# ==========================================
# Bulk label + order-import fan-out sizing (Sprint 51 R4, audit finding #4)
# Pre-R4 these were hardcoded to WORKER_CONCURRENCY=4 and MAX_PER_TENANT=2,
# which capped bulk-label throughput at ~12 shipments/min/tenant against
# a 5-15s carrier RTT — an order of magnitude below the 100/min/tenant
# target. Now externalised so ops can tune per env without a code push.
#
# Default 24 workers total = audit's min(hikari.max-pool-size / 2, 32)
# formula against the pool=50 default; leaves ~26 pool connections for
# the rest of the app (list queries, single label calls, admin, etc.).
# Per-tenant cap 8 keeps one tenant's giant batch from monopolising the
# pool — with pool=24 and per-tenant=8, three tenants can fully utilise
# the fan-out in parallel before hitting the fair-queue wait.
# ==========================================
bulk.worker-concurrency=${BULK_WORKER_CONCURRENCY:24}
bulk.max-per-tenant=${BULK_MAX_PER_TENANT:8}
import.commit-concurrency=${IMPORT_COMMIT_CONCURRENCY:24}
import.max-per-tenant=${IMPORT_MAX_PER_TENANT:8}

# ==========================================
# Redis (Sprint 50 Tier 1 finding #7)
# Backs the Idempotency-Key replay store on the public v2 API. Optional —
# when REDIS_HOST is unset the store no-ops (falls through to the handler
# every time) so unit tests + envs without Redis still boot cleanly.
# Container: `docker compose up -d` from repo root brings up a local
# redis:7-alpine on 6379.
#
# Sprint 50 Tier 1-C ops polish: REDIS_HOST no longer defaults to
# `localhost`. An empty REDIS_HOST used to silently connect to nothing
# in prod; now RedisPresenceLogger emits a boot-time WARN and Redis
# auto-config is excluded so the Lettuce factory does NOT throw
# `'host' must not be empty` at bean creation. To enable Redis in a
# real environment, set REDIS_HOST AND also set
# REDIS_AUTOCONFIGURE_EXCLUDE= (empty) to lift the exclusion. See
# docs/redis-production-deploy.md for the deploy checklist.
# ==========================================
spring.data.redis.host=${REDIS_HOST:}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
# Excluded by default so an unset REDIS_HOST cannot trigger a
# LettuceConnectionFactory bean-creation failure. Set
# REDIS_AUTOCONFIGURE_EXCLUDE= (empty string) alongside REDIS_HOST to
# turn Redis on. `REDIS_AUTOCONFIGURE_EXCLUDE=other.autoconfig` also
# works — set it to any comma-separated list to override the default.
spring.autoconfigure.exclude=${REDIS_AUTOCONFIGURE_EXCLUDE:org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration}

# ==========================================
# Rate limiting (Sprint 50 Tier 1 finding #15)
# Per-API-key fixed-window counter on the public v2 API. Applied at
# ApiKeyRateLimitInterceptor via Redis INCR + 60s TTL. Set to 0 to
# disable entirely; degrades to no-op when Redis is absent.
# ==========================================
rate.limit.api-key.requests-per-minute=${RATE_LIMIT_API_KEY_RPM:600}

# ==========================================
# Auth brute-force protection (Sprint 51 T2 finding #6)
# Backs AuthFailureLimiter for /auth/login and /oauth/token. Failure
# counter keyed by (ip, username) composite in Redis; when the count
# passes max-failures the pair is locked for lockout-minutes.
#
# Defaults picked to stop scripted attacks without punishing forgetful
# operators: 5 attempts / 15-minute window / 15-minute lockout. A real
# operator who typo'd their password 4 times has ~15 min of buffer
# before they hit the wall; a scripted attacker gets ~20 tries/hour.
#
# max-failures=0 disables the limiter (dev only). Redis absent → the
# limiter no-ops with a boot-time WARN (bcrypt still slows attacks).
# ==========================================
auth.brute-force.max-failures=${AUTH_BF_MAX_FAILURES:5}
auth.brute-force.window-minutes=${AUTH_BF_WINDOW_MIN:15}
auth.brute-force.lockout-minutes=${AUTH_BF_LOCKOUT_MIN:15}

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Sprint 49 Tier 1: kept as `update` because we have not yet produced a
# verified full-schema baseline for Flyway (no live prod DB access from
# the fix branch). Flyway now tracks the migration version (V1 baseline
# + V2 for Tier 0/1 columns) via `baseline-on-migrate=true`. A follow-up
# sprint will pg_dump the prod schema into a real V1 and switch this to
# `validate` so a stray field rename can no longer silently drop columns.
spring.jpa.hibernate.ddl-auto=update

# Sprint 49 Tier 3 Fix 7 — JDBC statement batching. Turns per-package
# save() loops (e.g. CarrierServiceImpl line ~988's LabelPackage inserts)
# from N single INSERTs into batched groups of 50. order_inserts /
# order_updates reorder statements so Hibernate can actually batch them
# (default behavior interleaves types and defeats batching).
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# ==========================================
# Flyway (Sprint 49 Tier 1)
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Pre-Flyway schema managed by ddl-auto
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.highlight_sql=false

# ==========================================
# Messages / Internationalization
# ==========================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600

# ==========================================
# Server Configuration
# ==========================================
server.port=8080
server.servlet.context-path=/
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# ==========================================
# Swagger / OpenAPI Configuration
# ==========================================
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ==========================================
# Jackson Configuration
# ==========================================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# ==========================================
# Logging Configuration
# Sprint 49 Tier 0: SQL + bind-parameter TRACE logging leaked PII, JWT
# material, and carrier client_secret into logs. Verbose settings moved
# to application-dev.properties; run with -Dspring.profiles.active=dev
# for local debugging.
# ==========================================
logging.level.com.multiship.backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.orm.jdbc.extract=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==========================================
# JWT Configuration
# Sprint 49 Tier 0: no hardcoded default. JWT_SECRET must be set as an
# environment variable to a random string of >= 32 bytes; startup will
# fail fast otherwise.
# ==========================================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# Sprint 50 PR Q1 — httpOnly cookie auth
# ==========================================
# The JWT is written by /api/v1/auth/login as a Set-Cookie header
# (HttpOnly + Secure + SameSite) so the SPA JS never sees it. This
# cuts XSS-driven token exfiltration to zero. See docs for the full
# migration plan.
#
# cookie.secure — MUST be true in prod (HTTPS only). Default false so
# dev on HTTP still works. Flip via COOKIE_SECURE=true env at deploy.
cookie.secure=${COOKIE_SECURE:false}
# cookie.samesite — Strict is safest when SPA + API share eTLD+1. For
# cross-site dev (SPA on 5173, API on 8080 on different hosts) use Lax.
# Prod default is Strict.
cookie.samesite=${COOKIE_SAMESITE:Strict}

# ==========================================
# Sprint 50 Tier 0.5 PR D — signup + invite policy
# ==========================================
# Public /auth/signup is OFF by default. Flip to true only if the deploy
# intentionally allows self-signup with a clientCode. Invite-accept flow
# (POST /auth/accept-invite) works regardless of this flag.
signup.public-enabled=${SIGNUP_PUBLIC_ENABLED:false}
# Signup attempt caps (moving window, 1h). Enforced per email AND per IP.
signup.rate-limit.email-per-hour=${SIGNUP_RATE_LIMIT_EMAIL:5}
signup.rate-limit.ip-per-hour=${SIGNUP_RATE_LIMIT_IP:20}
# Invite lifetime; invitees must accept within this window or a fresh
# invite must be issued.
invite.token-ttl-days=${INVITE_TTL_DAYS:7}
# Email-verification token lifetime.
signup.email-verify-ttl-hours=${SIGNUP_VERIFY_TTL_HOURS:24}

# ==========================================
# Sprint 50 finding #15 (A) — per-tenant rate limit
# ==========================================
# Cap on write requests per tenant per minute on the hot label + import
# paths (see TenantRateLimitFilter.DEFAULT_WATCHED_PATHS). 100/min matches
# the sprint's target throughput of 100 shipments/min/client and leaves
# room for rate calls, voids, address validation. Platform operators
# (ADMIN, wildcard API key) are never rate-limited.
tenant.rate-limit.default-per-minute=${TENANT_RATE_LIMIT_PER_MIN:100}
# Kill-switch: set false to bypass the filter entirely during incident
# without redeploying.
tenant.rate-limit.enabled=${TENANT_RATE_LIMIT_ENABLED:true}

# ==========================================
# Sprint 50 Tier 0.5 PR E — tenant scope tightening
# ==========================================
# When TRUE, a USER row with a non-null client_code is scoped to that
# client (cannot see other clients' orders / tenants). When FALSE (the
# default), USER remains an org-wide operator regardless of client_code
# — matches pre-PR-E behavior so nothing breaks on deploy. Ops flips
# this to true after backfilling client_code on every legacy USER via
# the /settings/users admin page.
access.scope-user-by-client=${ACCESS_SCOPE_USER_BY_CLIENT:false}

# ==========================================
# OpenAI (AI-assist features, e.g. paste-to-fill address)
# Sprint 49 Tier 0: no hardcoded key. Resolution order is
#   1) DB-stored setting `openai.api-key` (admin UI at /settings/system)
#   2) OPENAI_API_KEY env var
#   3) neither -> feature disabled (503 on AI endpoints)
# ==========================================
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# ==========================================
# Secrets encryption (Sprint 49 Tier 0)
# Base64-encoded 32-byte key used by SystemSettingService for at-rest
# encryption of admin-managed secrets (AES-GCM). If unset, the admin
# Settings page cannot store new secrets, but the app still boots and
# reads OPENAI_API_KEY from the env var normally.
# ==========================================
secrets.encryption-key=${SECRETS_ENCRYPTION_KEY:}

# ==========================================
# Carrier Configuration
# ==========================================
carrier.default-carrier-code=FEDEX
carrier.default-environment=SANDBOX
carrier.connection-timeout-seconds=30
carrier.read-timeout-seconds=30

# Sprint 48 B2 - MPS auto-split. When true, shipments exceeding a carrier's
# cap (from carrier_shipping_limit) are split into multiple carrier calls.
# Flip to false to hard-fail over-cap requests at the carrier instead
# (safety kill-switch if the splitter misbehaves in production).
carrier.auto-split-enabled=true

# Sprint 48 B5 - packaging validator kill-switch. When true, every write
# path (createManualShipment, generateLabel, rate-shop) runs PackagingValidator
# against the resolved preset. Flip to false to disable the check globally
# (over-packaged shipments then go to the carrier without pre-flight).
packaging.validation-enabled=true

