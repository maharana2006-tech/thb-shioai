# ==========================================
# Sprint 49 Tier 0 — local-dev-only overrides
#
# Activate with: -Dspring.profiles.active=dev
# ==========================================
logging.level.com.multiship.backend=DEBUG

# ==========================================
# Local Redis for SSE + idempotency.
#
# The default in application.properties excludes Redis autoconfig so
# CI can run without a Redis container. In local dev we DO have Redis
# (docker container "thb-shioai-redis" on localhost:6379), and without
# these overrides the operator sees:
#   - /events/stream returns 503 → FE falls back to 20 s polling +
#     retry-reconnect churn in DevTools Network
#   - "REDIS DISABLED — Idempotency-Key persistence is off" WARN
#   - AppEventBus in NO-OP mode → other operators' batch state
#     changes only show after the next 20 s poll
#
# Empty exclude = let Spring auto-provision the Redis datasource
# beans. Combined with spring.data.redis.host below, this enables
# SseController + AppEventBus + idempotency persistence.
#
# Requires -Dspring.profiles.active=dev on mvn spring-boot:run.
# ==========================================
spring.autoconfigure.exclude=
spring.data.redis.host=localhost
spring.data.redis.port=6379

# D2C History — point Fetch from NDS at the real prod view so dev can
# see live pending DTC orders. Base default in application.properties
# is TB_SHIPX_DTC_NEW_DEV; overridden here to match production.
oracle.dtc.view-name=TB_SHIPX_DTC_UVW
