# =============================================================================
# Production profile — activate with SPRING_PROFILES_ACTIVE=prod
# =============================================================================
# Sprint 51 security hardening. This file only OVERRIDES the base
# application.properties; everything not mentioned here is inherited. Its
# job is to close the "safe in dev, dangerous in prod" gaps flagged in the
# security audit. Nothing here changes local dev, which runs the default
# profile.
#
# It deliberately uses mandatory ${VAR} placeholders (no ":" default) for
# the three secrets below, so a misconfigured production boot FAILS LOUDLY
# at startup instead of silently starting up insecure.
# -----------------------------------------------------------------------------

# --- #5 Swagger / OpenAPI: OFF in prod --------------------------------------
# In dev these map the whole API and expose a "try it out" console. In prod
# that's free reconnaissance for an attacker. Disable both the UI and the
# raw /v3/api-docs JSON.
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.try-it-out-enabled=false

# --- #6 CORS: pin to real origins, no LAN wildcards -------------------------
# The base default trusts localhost + every RFC-1918 LAN range WITH
# credentials, which is a network-wide trust net. In prod, CORS_ALLOWED_ORIGINS
# MUST be set to the app's exact FQDN(s), comma-separated, e.g.
#   CORS_ALLOWED_ORIGINS=https://app.example.com,https://admin.example.com
# Mandatory placeholder: boot fails if it's unset rather than falling back
# to the permissive dev list.
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS}

# --- #2 At-rest secret encryption: REQUIRED in prod -------------------------
# When this key is unset the EncryptedStringConverter degrades to storing
# carrier client_secret / access_token as PLAINTEXT. That's acceptable for a
# throwaway dev DB but not for production. Mandatory placeholder → a prod
# boot without SECRETS_ENCRYPTION_KEY (base64, >=32 bytes) fails fast.
secrets.encryption-key=${SECRETS_ENCRYPTION_KEY}

# --- JWT signing secret: REQUIRED (already enforced, restated for clarity) --
# JwtService throws at boot on a blank/weak/known-compromised secret; the
# mandatory placeholder makes the failure a config error rather than a
# NullPointer deep in the filter chain.
jwt.secret=${JWT_SECRET}

# --- Schema management: never auto-mutate a prod schema ----------------------
# Flyway owns the schema in every environment; in prod, Hibernate must not
# silently ALTER tables. 'validate' fails startup if the entities and the
# migrated schema disagree.
spring.jpa.hibernate.ddl-auto=validate

# --- Public self-service signup stays OFF unless explicitly turned on --------
signup.public-enabled=${SIGNUP_PUBLIC_ENABLED:false}
