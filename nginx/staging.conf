## Outer nginx — single entry point on :80 (plain HTTP per staging decision).
## Reverse-proxies:
##   /api/v1/*   → backend:8080
##   /actuator/* → backend:8080  (health probe for the Dashboard)
##   everything else → frontend:80 (SPA)
##
## Same-origin by design so the httpOnly JWT cookie (SameSite=Lax) is sent
## on every API call. See multiship-react/vite.config.ts for the dev-time
## equivalent of this proxy.

upstream backend  { server backend:8080; keepalive 32; }
upstream frontend { server frontend:80;  keepalive 32; }

server {
  listen 80 default_server;
  server_name _;

  # Operators sometimes upload hundreds of orders in a CSV; the default 1MB
  # cap breaks it. 25MB is comfortable headroom for bulk-label batches too.
  client_max_body_size 25m;

  # Proxy knobs shared across all upstreams.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Carrier calls (label buy, rate shop) can take 20+ s on sandbox slowness.
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  location /api/v1/   { proxy_pass http://backend;  }
  location /actuator/ { proxy_pass http://backend;  }
  location /          { proxy_pass http://frontend; }
}
