# ============================================================
# LOCAL DEVELOPMENT ONLY
# ============================================================
# This compose file runs Redis without a password and binds it to
# 0.0.0.0:6379 for developer convenience. DO NOT DEPLOY AS-IS.
#
# Production requirements:
#   - Set requirepass (see commented-out --requirepass line below)
#   - Bind to private VPC / internal network only (not 0.0.0.0)
#   - TLS if traffic crosses untrusted networks
#   - Redis memory limit (maxmemory + eviction policy)
#
# See docs/redis-production-deploy.md for the hardening checklist.
# ============================================================
services:
  # Sprint 50 backlog groups C + E — Redis backs Idempotency-Key persistence
  # and the per-tenant rate limiter. Host port 6379 so Spring Boot can reach
  # it at spring.data.redis.host=localhost with no extra config.
  redis:
    image: redis:7-alpine
    container_name: thb-shioai-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    # Prod: enable auth by setting REDIS_PASSWORD and uncommenting:
    # command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend image built by Jib (no Dockerfile build here). Build it first:
  #   cd backend && ./mvnw compile jib:dockerBuild -Dzebrash.skip=false
  # Opt-in profile so `docker compose up` still starts only Redis:
  #   docker compose --profile backend up -d
  # Postgres is expected on the host (not in this file), reached via
  # host.docker.internal. Override any DB_* / JWT_* values from a .env file.
  backend:
    image: thb-shioai-backend:latest
    container_name: thb-shioai-backend
    profiles: ["backend"]
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://host.docker.internal:5432/multiship_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Empty list turns Redis auto-config back on (it's excluded by default).
      REDIS_AUTOCONFIGURE_EXCLUDE: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Replaces the Dockerfile HEALTHCHECK, which Jib can't set. The base image
    # has no curl, so the probe speaks HTTP over bash's /dev/tcp.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/8080 && printf "GET /actuator/health/liveness HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && grep -q "\"UP\"" <&3'
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  redis-data:
