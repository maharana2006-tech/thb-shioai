# ============================================================
# LOCAL DEVELOPMENT ONLY
# ============================================================
# This compose file runs Redis without a password and binds it to
# 0.0.0.0:6379 for developer convenience. DO NOT DEPLOY AS-IS.
#
# Production requirements:
#   - Set requirepass (see commented-out --requirepass line below)
#   - Bind to private VPC / internal network only (not 0.0.0.0)
#   - TLS if traffic crosses untrusted networks
#   - Redis memory limit (maxmemory + eviction policy)
#
# See docs/redis-production-deploy.md for the hardening checklist.
# ============================================================
services:
  # Sprint 50 backlog groups C + E — Redis backs Idempotency-Key persistence
  # and the per-tenant rate limiter. Host port 6379 so Spring Boot can reach
  # it at spring.data.redis.host=localhost with no extra config.
  redis:
    image: redis:7-alpine
    container_name: thb-shioai-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    # Prod: enable auth by setting REDIS_PASSWORD and uncommenting:
    # command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
