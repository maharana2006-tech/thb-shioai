name: printer-scan-agent-publish

# PR-Printer-P4c — publishes the multiship-lan-scanner Docker image to
# GHCR on a git tag matching `lan-scanner-v*`. The tag suffix (after
# lan-scanner-v) is the version pushed as both the immutable tag and
# `:latest`. Example: `git tag lan-scanner-v0.1.1 && git push --tags`
# publishes ghcr.io/{owner}/multiship-lan-scanner:0.1.1 + :latest.
#
# Keep the trigger narrow (tags-only) so a random branch push doesn't
# ship an unreviewed image. Manual dispatch is enabled for hotfix
# rebuilds when the runner had a flake on the original tag push.
on:
  push:
    tags:
      - 'lan-scanner-v*'
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Version suffix to publish (e.g. 0.1.1)'
        required: true

concurrency:
  group: printer-scan-agent-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build + push GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Derive the version tag from either the git tag (strip
      # `lan-scanner-v` prefix) or the workflow_dispatch input.
      - name: Resolve tag version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.tag_version }}"
          else
            V="${GITHUB_REF_NAME#lan-scanner-v}"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Publishing multiship-lan-scanner:${V}"

      # Lowercase the owner name — GHCR image paths are case-sensitive
      # even though the API accepts either. Some GitHub orgs mix case.
      - name: Compute image name
        id: image
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${OWNER_LC}/multiship-lan-scanner" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: printer-scan-agent
          file: printer-scan-agent/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          # Cache builds across runs so a re-tag doesn't rebuild the
          # gradle layer from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
