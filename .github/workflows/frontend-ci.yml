name: frontend-ci

# Sprint 51 FE-NA1 — first frontend CI workflow.
# Runs on PRs touching the React app + workflow file. Enforces:
#   · npm install (locked to package-lock.json for reproducibility)
#   · TypeScript build (`npm run build` runs `tsc -b` first)
#   · Lint clean
#   · Unit tests green
#   · `npm audit --omit=dev --audit-level=high` — HIGH/CRITICAL fails the job
#
# Kept intentionally minimal — no dev-dep audit yet (dev-only vulns are
# noisy and rarely reachable in prod) and no E2E; that comes later.
on:
  pull_request:
    paths:
      - 'multiship-react/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'multiship-react/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    name: build + audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: multiship-react

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: multiship-react/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - name: Lint
        # Sprint 51 FE-NA1 initially shipped this as non-blocking (`|| true`)
        # because the first frontend CI surfaced 107 preexisting eslint
        # errors (react-hooks/set-state-in-effect, no-explicit-any, ...).
        # Sprint 51 followup — the errors were fully cleared (per-site
        # justifications on the legitimate patterns; real fixes on the
        # rest) so lint is now blocking again. New drift will fail CI.
        run: npm run lint

      - name: Build (typecheck + Vite)
        # npm run build runs `tsc -b && vite build` — one command covers
        # the typecheck the FE-M1 pipeline expects.
        env:
          # Sprint 51 FE-M1 — vite.config.ts requires this on prod builds.
          # CI verifies both the assertion + the bundle output.
          VITE_API_BASE_URL: /api/v1
        run: npm run build

      - name: Unit tests
        run: npm test

      # HIGH/CRITICAL prod-dep vulns fail the job. Dev-only vulns
      # (`--omit=dev`) are excluded — they can't reach shipped code.
      - name: npm audit (prod, high+)
        run: npm audit --omit=dev --audit-level=high
