name: printer-scan-agent-ci

# P2 scan-agent MVP — separate lightweight workflow so the main
# backend/FE pipelines don't blow up on a Gradle project they don't
# know about. Runs only when the subdir or this workflow changes.
on:
  pull_request:
    paths:
      - 'printer-scan-agent/**'
      - '.github/workflows/printer-scan-agent-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'printer-scan-agent/**'
      - '.github/workflows/printer-scan-agent-ci.yml'

concurrency:
  group: printer-scan-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: gradle build + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: printer-scan-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Gradle wrapper (bootstrap)
        run: |
          # No wrapper committed yet (P2 scope). Use system gradle from
          # the setup-gradle action which provisions the latest release.
          gradle --version
      - name: Compile + test
        run: gradle --no-daemon test shadowJar
      - name: Verify shadow jar exists
        run: |
          test -f build/libs/multiship-lan-scanner-0.1.0.jar \
            && echo "shadow jar present" \
            || (echo "shadow jar missing" && exit 1)
