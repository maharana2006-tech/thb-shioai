name: backend-ci

# Runs the backend unit-test suite on every PR touching the backend and on
# pushes to the long-lived branches. Skips Testcontainers integration
# tests (they are guarded by INTEGRATION_TESTS=1 in AbstractIntegrationTest
# so unit-only runs don't need Docker).
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

# Cancel any prior run for the same PR so a rapid re-push doesn't stack.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: mvn test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # Enables ~/.m2/repository caching keyed on the backend pom.xml
          # so subsequent runs skip the dependency download.
          cache: maven
          cache-dependency-path: backend/pom.xml

      # The exec-maven-plugin binds a bash cleanup script to the validate
      # phase (see backend/pom.xml). Ubuntu runners already have bash, so
      # no extra install needed — this step is documentation.
      - name: Show tool versions
        run: |
          java -version
          mvn --version

      - name: Run backend unit tests
        working-directory: backend
        # -B: batch mode (no progress bars, cleaner CI logs)
        # -ntp: no-transfer-progress
        # -DskipITs: extra insurance; the codebase's integration tests are
        #            already guarded by @EnabledIfEnvironmentVariable but
        #            this makes intent explicit.
        run: mvn -B -ntp -DskipITs test

      # Upload surefire reports so a failure can be inspected without
      # re-running locally. Only fires on failure to keep CI storage light.
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
