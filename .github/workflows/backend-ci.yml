name: backend-ci

# Runs the backend unit-test suite on every PR touching the backend and on
# pushes to the long-lived branches. Skips Testcontainers integration
# tests (they are guarded by INTEGRATION_TESTS=1 in AbstractIntegrationTest
# so unit-only runs don't need Docker).
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

# Cancel any prior run for the same PR so a rapid re-push doesn't stack.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: mvn test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # BackendApplicationTests is a @SpringBootTest that loads the full
    # ApplicationContext — including the JPA EntityManagerFactory, which
    # opens a real JDBC connection during startup. A Postgres service on
    # the runner keeps that smoke test honest instead of dropping to H2
    # (which would diverge from prod SQL dialect).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: multiship_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/multiship_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Sprint 49 Tier 0: JwtService rejects short/compromised secrets on
      # startup. Throwaway value; every real deploy sets its own.
      JWT_SECRET: test-only-jwt-secret-do-not-use-in-production-32b

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # Enables ~/.m2/repository caching keyed on the backend pom.xml
          # so subsequent runs skip the dependency download.
          cache: maven
          cache-dependency-path: backend/pom.xml

      # The exec-maven-plugin binds a bash cleanup script to the validate
      # phase (see backend/pom.xml). Ubuntu runners already have bash, so
      # no extra install needed — this step is documentation.
      - name: Show tool versions
        run: |
          java -version
          mvn --version

      - name: Run backend unit tests
        working-directory: backend
        # -B: batch mode (no progress bars, cleaner CI logs)
        # -ntp: no-transfer-progress
        # -DskipITs: extra insurance; the codebase's integration tests are
        #            already guarded by @EnabledIfEnvironmentVariable but
        #            this makes intent explicit.
        run: mvn -B -ntp -DskipITs test

      # Upload surefire reports so a failure can be inspected without
      # re-running locally. Only fires on failure to keep CI storage light.
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # Sprint 51 T5a — closes audit finding #10. Pre-T5a the CI only ran
  # `mvn -DskipITs test`, and INTEGRATION_TESTS was never set — so every
  # class extending AbstractIntegrationTest (guarded by
  # @EnabledIfEnvironmentVariable) was silently skipped. That meant the
  # fresh-DB Flyway migration guard, tenant-scope enforcement,
  # idempotency Redis semantics, user-secret encryption, webhook
  # HMAC roundtrip, and login-deactivation flow were only checked on
  # developer laptops. This job wires up the integration suite so
  # migration + tenant-scope regressions can't merge green.
  #
  # Runs `mvn verify` with INTEGRATION_TESTS=1 set. Testcontainers spins
  # up its own Postgres (16-alpine) per JVM — Docker is preinstalled on
  # ubuntu-latest, no service container needed.
  integration-test:
    name: mvn verify (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    # BackendApplicationTests (@SpringBootTest smoke) opens a real JDBC
    # connection at boot to validate the ApplicationContext. It runs in
    # BOTH the unit + integration jobs so we need the same runner-side
    # postgres service here. AbstractIntegrationTest classes still get
    # their own Testcontainers-managed postgres per JVM — this service
    # container is just for the smoke test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: multiship_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Runner-side DB for BackendApplicationTests (mirrors the unit job).
      DB_URL: jdbc:postgresql://localhost:5432/multiship_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Same throwaway values the unit-test job uses. AbstractIntegrationTest
      # overrides jwt.secret + secrets.encryption-key via @TestPropertySource
      # so these are only used by classes that don't override.
      JWT_SECRET: test-only-jwt-secret-do-not-use-in-production-32b
      SECRETS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # Flip the guard so @EnabledIfEnvironmentVariable(named="INTEGRATION_TESTS")
      # matches. Without this the class-level guards keep every IT skipped
      # even though we run `verify`.
      INTEGRATION_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Surefire discovers *IntegrationTest.java classes by default —
      # the reason they're skipped in the unit job is the class-level
      # @EnabledIfEnvironmentVariable guard, not a Maven include filter.
      # Setting INTEGRATION_TESTS=1 lets JUnit run them; `mvn test`
      # is enough (no failsafe binding is configured in the pom).
      - name: Run integration tests
        working-directory: backend
        run: mvn -B -ntp test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: backend/target/surefire-reports/
          retention-days: 7
