<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy. Sprint 50 P/#15 introduced this with
      'unsafe-inline' on script-src as an interim — the rationale then
      was that JWTs lived in localStorage so tight CSP was the main
      XSS defense. Sprint 50 Q1/Q2/Q3 migrated auth to httpOnly cookies
      (JS can't read the token even with XSS), and Sprint 51 T6c
      inspected the production build output:
        - dist/index.html has NO inline <script> tags — Vite emits
          all app code as external modules. `script-src 'self'` is
          sufficient; 'unsafe-inline' was defensive overkill.
        - React's `style={{...}}` produces inline style attributes on
          rendered elements (46 usages across 14 components). CSP's
          style-src DOES enforce those, so 'unsafe-inline' stays on
          style-src until we sweep to Tailwind-only styling.
        - connect-src `https:` was a wildcard; tightened to `'self'`
          (production ships same-origin API behind a reverse proxy).
          LAN CIDRs kept for local dev + docker-compose.
      Loosen only if a specific integration needs it — record why here.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self';
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data: https:;
                   font-src 'self' data:;
                   connect-src 'self' http://localhost:* http://127.0.0.1:* http://192.168.*:* http://10.*:* http://172.16.*:* http://172.17.*:* http://172.18.*:* http://172.19.*:* http://172.2*.*:* http://172.30.*:* http://172.31.*:*;
                   frame-ancestors 'none';
                   base-uri 'self';
                   form-action 'self';" />
    <title>multiship-react</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
