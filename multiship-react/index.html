<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy. Sprint 50 P/#15 introduced this with
      'unsafe-inline' on script-src as an interim — the rationale then
      was that JWTs lived in localStorage so tight CSP was the main
      XSS defense. Sprint 50 Q1/Q2/Q3 migrated auth to httpOnly cookies
      (JS can't read the token even with XSS), and Sprint 51 T6c
      inspected the production build output:
        - dist/index.html has NO inline <script> tags — Vite emits
          all app code as external modules. `script-src 'self'` is
          sufficient; 'unsafe-inline' was defensive overkill.
        - React's `style={{...}}` produces inline style attributes on
          rendered elements (46 usages across 14 components). CSP's
          style-src DOES enforce those, so 'unsafe-inline' stays on
          style-src until we sweep to Tailwind-only styling.
        - connect-src `https:` was a wildcard; tightened to `'self'`
          which covers same-origin (both dev via Vite proxy and prod
          behind a reverse proxy). The Vite dev proxy at :5173 routes
          /api/* → :8080 so all backend calls are same-origin.
      Env-agnostic: this CSP works in dev (Vite HMR + proxy), LAN
      (Vite dev binds to `--host` if invoked; same-origin still), and
      prod (SPA + API share origin). No CIDR wildcards — CSP host
      wildcards must be leftmost (`*.example.com`) or a bare `*`;
      numeric-segment wildcards like `192.168.*` are silently dropped
      by every browser (that was the source of 9 console errors).
      `frame-ancestors` is spec-ignored inside <meta>; it lives on the
      Spring SecurityConfig response headers where it's actually
      enforceable (default is X-Frame-Options: DENY).
      Loosen only if a specific integration needs it — record why here.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self';
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data: https:;
                   font-src 'self' data:;
                   connect-src 'self' ws: wss:;
                   base-uri 'self';
                   form-action 'self';" />
    <title>multiship-react</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
